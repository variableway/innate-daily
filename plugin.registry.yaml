protocol: innate.domain-pages.v1
version: 1

template:
  repo: variableway/innate-fe-templates
  release: pages-kit
  shell: writing-shell.zip

site:
  title: Innate Daily
  defaultPath: /
  home: ./docs/pages/home.md

domains:
  - id: writing
    content: ./docs/content
    mount: content
    path: /writing

pages:
  outDir: site
