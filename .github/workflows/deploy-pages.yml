name: Deploy writing to GitHub Pages

# 本仓自己的静态站。不 clone 整个 fe-templates，只 sparse 拉 @innate/ui。
on:
  push:
    branches: [main, master]
    paths:
      - "use-cases/**"
      - "docs/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this site
        uses: actions/checkout@v5
        with:
          path: site

      - name: Sparse checkout @innate/ui
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.FE_TEMPLATES_REPO || 'variableway/innate-fe' }}
          token: ${{ secrets.FE_TEMPLATES_TOKEN || github.token }}
          path: templates
          sparse-checkout: |
            packages/ui
            packages/tsconfig
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/pnpm-lock.yaml

      - name: Install and build
        working-directory: templates
        run: |
          mkdir -p apps
          rm -rf apps/daily-work
          mv ../site apps/daily-work
          # pnpm 只从 workspace 根（templates/pnpm-workspace.yaml）读设置，站点自带的
          # pnpm-workspace.yaml / .npmrc 在这个注入式 workspace 里都不生效。
          # @innate/ui@^0.1.0 没有发布到 npm（站点本地开发走 127.0.0.1:4873 私有源），
          # 这里显式打开 workspace 链接，让它用 sparse checkout 出来的 packages/ui，
          # 否则 pnpm 会去 npm 找 @innate/ui 并 404。
          printf '\nlinkWorkspacePackages: true\npreferWorkspacePackages: true\n' >> pnpm-workspace.yaml
          # daily-work 是运行时注入的 workspace 项目，base 仓 lockfile 没有它的 importer；
          # CI 下 pnpm 默认 frozen-lockfile 会拒绝，放行让 runner 内重新解析（不回写仓库）
          pnpm install --filter @innate/daily... --no-frozen-lockfile
          PUBLIC_PATH=./ pnpm --filter @innate/daily build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: templates/apps/daily-work/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
