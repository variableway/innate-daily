# 供给链策略豁免名单。
#
# minimumReleaseAgeExclude 按「包名」生效，对该包的全部版本都适用；
# 同一个包名出现多条时只有靠前的一条生效，所以这里每个包名只留一条。
# （逐版本钉死如 '@innate/ui@0.1.0' 会在发新版本时立刻失效。）
#
# @innate/* 是本地私有源（127.0.0.1:4873）上的自建包，不走公网 npm，
# 冷却期闸门对它们没有意义：包由自己的基础仓构建后立即发布，
# 等 24h 只会让本地开发卡住。
minimumReleaseAgeExclude:
  - '@innate/ui'
  - lucide-react@1.61.0 || 1.65.0
  - vite@8.3.5
